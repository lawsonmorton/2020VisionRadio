name: Daily 2020 Vision Radio Script Automation

on:
  schedule:
    # Runs Sunday through Thursday at 3:50 PM AST (19:50 PM UTC)
    # Bypasses peak top-of-the-hour queue delays to deliver by 4:00 PM AST
    - cron: '50 19 * * 0-4'
  workflow_dispatch: # Allows manual testing from the Actions tab

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-docx openai anthropic feedparser

      - name: Run Radio Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKN_POLICE_FB_RSS: ${{ secrets.SKN_POLICE_FB_RSS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          PRESENTER_EMAIL: ${{ secrets.PRESENTER_EMAIL }}
        run: python radio_automation.py
