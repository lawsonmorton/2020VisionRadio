name: Daily radio script

on:
  schedule:
    - cron: "0 22 * * *"      # 22:00 UTC = 6:00 PM St. Kitts time
  workflow_dispatch:
    inputs:
      check_feeds:
        description: "Only test the news feeds"
        type: boolean
        default: false

permissions:
  contents: write              # lets the job save seen_stories.json

jobs:
  build-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install feedparser python-docx requests google-genai openai anthropic

      - name: Test feeds (manual run only)
        if: ${{ github.event.inputs.check_feeds == 'true' }}
        run: python radio_automation.py --check-feeds

      - name: Generate and email script
        if: ${{ github.event.inputs.check_feeds != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          PRESENTER_EMAIL: ${{ secrets.PRESENTER_EMAIL }}
          SKN_POLICE_FB_RSS: ${{ secrets.SKN_POLICE_FB_RSS }}
          NEVIS_NEWSCAST_RSS: ${{ secrets.NEVIS_NEWSCAST_RSS }}
          TV_CARIBBEAN_RSS: ${{ secrets.TV_CARIBBEAN_RSS }}
        run: python radio_automation.py

      - name: Save story history
        if: ${{ github.event.inputs.check_feeds != 'true' }}
        run: |
          git config user.name "radio-bot"
          git config user.email "radio-bot@users.noreply.github.com"
          git add seen_stories.json
          git diff --cached --quiet || (git commit -m "Update seen stories" && git push)
