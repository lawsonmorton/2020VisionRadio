name: Daily 2020 Vision Radio Script Automation

on:
  schedule:
    # Runs Sunday through Thursday at 15:00 UTC (3:00 PM AST)
    - cron: '0 19 * * 0-4'
  workflow_dispatch: # Allows manual trigger testing

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Radio Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          PRESENTER_EMAIL: ${{ secrets.PRESENTER_EMAIL }}
        run: python radio_automation.py
